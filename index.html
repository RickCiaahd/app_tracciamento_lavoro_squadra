<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17324d">
  <meta name="description" content="Pianificazione e report delle attività di squadra">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>Squadra · Attività</title>
</head>
<body>
  <header class="topbar">
    <div><p class="eyebrow">Pianificazione operativa</p><h1>Squadra</h1></div>
    <button id="installBtn" class="ghost hidden">Installa app</button>
  </header>
  <main>
    <nav class="tabs" aria-label="Sezioni">
      <button data-view="planner" class="active">Pianifica</button>
      <button data-view="dashboard">Report</button>
      <button data-view="settings">Impostazioni</button>
    </nav>

    <section id="planner" class="view active">
      <div class="toolbar card">
        <button id="prevWeek" aria-label="Settimana precedente">‹</button>
        <label>Settimana del <input id="weekDate" type="date"></label>
        <button id="nextWeek" aria-label="Settimana successiva">›</button>
        <button id="todayBtn" class="secondary">Oggi</button>
      </div>
      <div class="legend"><span></span> Tocca una casella per scegliere le attività</div>
      <div id="calendar" class="calendar card"></div>
    </section>

    <section id="dashboard" class="view">
      <div class="toolbar card report-controls">
        <label>Periodo
          <select id="periodType"><option value="week">Settimana</option><option value="month" selected>Mese</option><option value="year">Anno</option></select>
        </label>
        <label>Data di riferimento <input id="reportDate" type="date"></label>
      </div>
      <div id="summary" class="summary"></div>
      <div id="charts" class="charts"></div>
    </section>

    <section id="settings" class="view">
      <div class="settings-grid">
        <article class="card"><div class="section-title"><h2>Operatori</h2><button data-add="operator">+ Aggiungi</button></div><div id="operatorsList" class="edit-list"></div></article>
        <article class="card"><div class="section-title"><h2>Attività</h2><button data-add="activity">+ Aggiungi</button></div><div id="activitiesList" class="edit-list"></div></article>
        <article class="card data-card"><h2>Dati</h2><p>I dati restano su questo dispositivo e funzionano offline.</p><div class="button-row"><button id="exportBtn">Esporta backup</button><label class="button secondary">Importa backup<input id="importInput" type="file" accept="application/json" hidden></label><button id="resetBtn" class="danger">Ripristina esempio</button></div></article>
      </div>
    </section>
  </main>

  <dialog id="activityDialog">
    <form method="dialog" id="activityForm">
      <div class="dialog-head"><div><p id="dialogDate" class="eyebrow"></p><h2 id="dialogOperator"></h2></div><button value="cancel" class="icon" aria-label="Chiudi">×</button></div>
      <div id="activityChecks" class="check-list"></div>
      <div class="dialog-actions"><button value="cancel" class="secondary">Annulla</button><button id="saveAssignment" value="default">Salva attività</button></div>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
